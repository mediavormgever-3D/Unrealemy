[Unrealemy]
; Opent het overzicht van de leerlijnen zodra de editor klaar is met opstarten.
bOpenHubOnStartup=True

; Docentknoppen 'Oplossing' en 'Herlaad'. Docenten kunnen dit ook per
; Windows-account aanzetten met de omgevingsvariabele UNREALEMY_TEACHER=1.
bTeacherMode=False

; Mag een student naar de volgende stap zonder de huidige te halen?
bAllowSkip=False

; Verborgen panelen direct weer sluiten als een student ze via het menu opent.
bEnforceUiProfiles=True

; Geluidje bij een voltooide stap.
bPlaySounds=True

; Seconden tot de volgende stap opent na 'Voltooid'. 0 = alleen met de knop Volgende.
AutoAdvanceDelay=1.5

; Hoe vaak (seconden) de actieve stap gecontroleerd wordt.
CheckInterval=0.25
